<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call History</title>
    <link rel="stylesheet" href="Css/call-history.css">
</head>
<body>
    <div class="call-history-container">
        <!-- Header -->
        <div class="history-header">
            <button id="backBtn" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <h1>Call History</h1>
            <button id="clearHistoryBtn" class="clear-btn" title="Clear History">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                </svg>
            </button>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="incoming">Incoming</button>
            <button class="filter-tab" data-filter="outgoing">Outgoing</button>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <p>Loading call history...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="#8696a0">
                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
            </svg>
            <h2>No Call History</h2>
            <p>Your call history will appear here</p>
        </div>

        <!-- Call History List -->
        <div id="callHistoryList" class="call-history-list">
            <!-- Call items will be dynamically added here -->
        </div>
    </div>

    <!-- Call Details Modal -->
    <div id="callDetailsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Call Details</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <div class="detail-avatar">
                        <span id="detailInitial">U</span>
                    </div>
                    <div class="detail-info">
                        <h3 id="detailName">User Name</h3>
                        <p id="detailType" class="detail-type">Voice Call</p>
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-item">
                        <span class="detail-label">Status</span>
                        <span id="detailStatus" class="detail-value">Completed</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Direction</span>
                        <span id="detailDirection" class="detail-value">Outgoing</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Duration</span>
                        <span id="detailDuration" class="detail-value">00:00</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Date</span>
                        <span id="detailDate" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Time</span>
                        <span id="detailTime" class="detail-value">-</span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="callBackBtn" class="action-button voice-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                        Voice Call
                    </button>
                    <button id="videoCallBackBtn" class="action-button video-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                        Video Call
                    </button>
                    <button id="deleteCallBtn" class="action-button delete-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script src="js/call-history.js"></script>
</body>
</html>
