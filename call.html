<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call</title>
    <link rel="stylesheet" href="Css/call.css">
</head>
<body>
    <!-- Call Screen -->
    <div id="callScreen" class="call-screen">
        <!-- Video Call Container -->
        <div id="videoContainer" class="video-container" style="display: none;">
            <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
            <video id="localVideo" class="local-video" autoplay playsinline muted></video>
            
            <!-- User Info Overlay -->
            <div class="call-info-overlay">
                <div class="user-avatar-large">
                    <span id="callUserInitial">U</span>
                </div>
                <h2 id="callUserName">User Name</h2>
                <p id="callStatus">Connecting...</p>
                <p id="callDuration" style="display: none;">00:00</p>
            </div>
        </div>

        <!-- Voice Call Container -->
        <div id="voiceContainer" class="voice-container">
            <div class="voice-call-content">
                <div class="user-avatar-large">
                    <span id="voiceUserInitial">U</span>
                </div>
                <h2 id="voiceUserName">User Name</h2>
                <p id="voiceCallStatus">Connecting...</p>
                <p id="voiceCallDuration" style="display: none;">00:00</p>
            </div>
        </div>

        <!-- Call Controls -->
        <div class="call-controls">
            <button id="toggleMuteBtn" class="control-btn mute-btn" title="Mute">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>

            <button id="toggleVideoBtn" class="control-btn video-btn" style="display: none;" title="Toggle Camera">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
            </button>

            <button id="endCallBtn" class="control-btn end-call-btn" title="End Call">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>

            <button id="toggleSpeakerBtn" class="control-btn speaker-btn" title="Speaker" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
            </button>
        </div>

        <!-- Incoming Call Modal -->
        <div id="incomingCallModal" class="incoming-call-modal" style="display: none;">
            <div class="incoming-call-content">
                <div class="user-avatar-large">
                    <span id="incomingUserInitial">U</span>
                </div>
                <h2 id="incomingCallerName">User Name</h2>
                <p id="incomingCallType">Voice Call</p>
                
                <div class="incoming-call-actions">
                    <button id="rejectCallBtn" class="action-btn reject-btn">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                        </svg>
                        <span>Decline</span>
                    </button>
                    
                    <button id="acceptCallBtn" class="action-btn accept-btn">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                        <span>Accept</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="ringtone" loop>
        <source src="sounds/ringtone.mp3" type="audio/mpeg">
    </audio>
    <audio id="callEndSound">
        <source src="sounds/call-end.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script src="js/call.js"></script>
</body>
</html>
