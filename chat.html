<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat</title>
    <link rel="stylesheet" href="Css/chat.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <div class="header-buttons"> 
                    
                    
                    <button id="profileBtn" class="icon-btn" title="Profile" onclick="window.location.href='profile.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </button>
                    <button id="settingsBtn" class="icon-btn" title="Settings"
        onclick="window.location.href='dashboard.html'">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14,12.94a7.43,7.43,0,0,0,.05-.94,7.43,7.43,0,0,0-.05-.94l2.11-1.65a.5.5,0,0,0,.12-.65l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.28,7.28,0,0,0-1.63-.94l-.38-2.65A.5.5,0,0,0,11.8,2H8.2a.5.5,0,0,0-.49.42L7.33,5.07a7.28,7.28,0,0,0-1.63.94l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.65L2.86,11.06a7.43,7.43,0,0,0-.05.94,7.43,7.43,0,0,0,.05.94L.75,14.59a.5.5,0,0,0-.12.65l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.28,7.28,0,0,0,1.63.94l.38,2.65a.5.5,0,0,0,.49.42h3.6a.5.5,0,0,0,.49-.42l.38-2.65a7.28,7.28,0,0,0,1.63-.94l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.65ZM10,15.5A3.5,3.5,0,1,1,13.5,12,3.5,3.5,0,0,1,10,15.5Z"/>
    </svg>
</button>

                    <button id="callHistoryBtn" class="icon-btn" title="Call History">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                    </button>
                    <button id="groupsBtn" class="icon-btn" title="Groups" onclick="window.location.href='groups.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                        </svg>
                    </button>
                   
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchUsers" placeholder="Search users by name or email...">
            </div>
            <div id="usersList" class="users-list">
                <!-- Chat list will be loaded here -->
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="welcomeScreen" class="welcome-screen">
                <h1>LiveTalk Website</h1>
                <p>Select a chat to start messaging</p>
            </div>

            <div id="chatScreen" class="chat-screen" style="display: none;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <!-- Back Button -->
                    <button id="backBtn" class="back-btn" title="Back to chats">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </button>
                    
                    <div class="chat-header-info">
                        <h3 id="chatUserName">User Name</h3>
                        <p id="chatUserStatus" class="user-status">offline</p>
                    </div>
                    
                    <!-- Call Buttons -->
                    <div class="call-buttons">
                        <button id="voiceCallBtn" class="call-btn" title="Voice Call">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                            </svg>
                        </button>
                        <button id="videoCallBtn" class="call-btn" title="Video Call">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                            </svg>
                        </button>
                        <button id="clearChatBtn" class="call-btn" title="Clear Chat">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                            </svg>
                        </button>
                        <button id="blockBtn" class="call-btn block-btn" title="Block User">Block</button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div id="messagesContainer" class="messages-container">
                    <!-- Messages will be loaded here -->
                </div>

                <!-- Typing Indicator -->
                <div id="typingIndicator" class="typing-indicator" style="display: none;">
                    <span class="typing-text">typing...</span>
                </div>

                <!-- Message Input Area -->
                <div class="message-input-area">
                    <button id="attachBtn" class="attach-btn" title="Attach">📎</button>
                    
                    <input type="file" id="fileInput" style="display: none;" accept="image/*,video/*">
                    
                    <div class="attach-menu" id="attachMenu" style="display: none;">
                        <button id="imageBtn" class="attach-option">📷 Image</button>
                        <button id="videoBtn" class="attach-option">🎥 Video</button>
                    </div>

                    <input type="text" id="messageInput" placeholder="Type a message" class="message-input">
                    
                    <!-- Voice Record Button -->
                    <button id="voiceRecordBtn" class="voice-record-btn" title="Voice Message">🎤</button>
                    
                    <button id="sendBtn" class="send-btn">Send</button>
                </div>

                <!-- Voice Recording Indicator -->
                <div id="voiceRecordingIndicator" class="voice-recording-indicator" style="display: none;">
                    <div class="recording-animation"></div>
                    <span id="recordingTime">0:00</span>
                    <button id="cancelRecordBtn" class="cancel-record-btn" title="Cancel">✖</button>
                    <button id="sendRecordBtn" class="send-record-btn" title="Send">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Incoming Call Notification (Popup) -->
    <div id="incomingCallNotification" class="incoming-call-notification" style="display: none;">
        <div class="notification-content">
            <div class="notification-avatar">
                <span id="notifCallerInitial">U</span>
            </div>
            <div class="notification-info">
                <h4 id="notifCallerName">User Name</h4>
                <p id="notifCallType">Voice Call</p>
            </div>
            <div class="notification-actions">
                <button id="notifDeclineBtn" class="notif-btn decline" title="Decline">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                    </svg>
                </button>
                <button id="notifAcceptBtn" class="notif-btn accept" title="Accept">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Audio for incoming call ringtone -->
    <audio id="incomingRingtone" loop>
        <source src="sounds/incoming.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
