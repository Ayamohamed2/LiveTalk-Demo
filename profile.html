<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0A0E1A;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Profile Container - مع scroll */
        .profile-container {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .profile-card {
            background: #1A2233;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .back-to-chat {
            background: none;
            border: none;
            color: #8696a0;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            min-width: 40px;
            min-height: 40px;
        }

        .back-to-chat:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .profile-header h2 {
            color: #e9edef;
            font-size: 24px;
            font-weight: 600;
            flex: 1;
        }

        /* Profile Image Section */
        .profile-image-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-image-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #5B9BD5;
            display: block;
        }

        .profile-image-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #5B9BD5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            font-weight: 600;
            border: 4px solid #5B9BD5;
        }

        .change-image-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #5B9BD5;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .change-image-btn:hover {
            background: #3A7BBD;
            transform: scale(1.1);
        }

        .change-image-btn svg {
            pointer-events: none;
        }

        /* Form Styles */
        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #8696a0;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            background: #1E2A3A;
            border: 1px solid #253848;
            border-radius: 8px;
            padding: 12px 15px;
            color: #e9edef;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }

        .form-group input:focus {
            border-color: #5B9BD5;
        }

        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #151E2A;
        }

        /* Action Buttons */
        .profile-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-primary,
        .btn-secondary {
            flex: 1;
            min-width: 120px;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #5B9BD5;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #3A7BBD;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(91, 155, 213, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #1E2A3A;
            color: #e9edef;
        }

        .btn-secondary:hover {
            background: #253848;
        }

        /* Loading Spinner */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #5B9BD5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success/Error Messages */
        .success-message,
        .error-message {
            display: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            animation: slideIn 0.3s ease-out;
        }

        .success-message.active,
        .error-message.active {
            display: block;
        }

        .success-message {
            background: #4caf50;
            color: white;
        }

        .error-message {
            background: #d32f2f;
            color: white;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .profile-container {
                padding: 15px;
            }

            .profile-card {
                padding: 25px;
                margin: 10px auto;
            }

            .profile-header h2 {
                font-size: 20px;
            }

            .profile-image,
            .profile-image-placeholder {
                width: 120px;
                height: 120px;
                font-size: 50px;
            }

            .form-group input {
                font-size: 16px; /* منع zoom في iOS */
            }
        }

        @media (max-width: 480px) {
            .profile-card {
                padding: 20px;
            }

            .profile-actions {
                flex-direction: column;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
            }

            .profile-image,
            .profile-image-placeholder {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }
        }

        /* Ensure scrollability */
        html {
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-card">
            <!-- Header -->
            <div class="profile-header">
                <button class="back-to-chat" onclick="goBack()" type="button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </button>
                <h2>Profile Settings</h2>
            </div>

            <!-- Profile Image -->
            <div class="profile-image-section">
                <div class="profile-image-wrapper">
                    <img id="profileImage" class="profile-image" src="" alt="Profile" style="display: none;">
                    <div id="profilePlaceholder" class="profile-image-placeholder">U</div>
                    <button class="change-image-btn" onclick="document.getElementById('imageInput').click()" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                    </button>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            </div>

            <!-- Profile Form -->
            <form id="profileForm" class="profile-form" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" disabled>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+20 1234567890">
                </div>

                <!-- Action Buttons -->
                <div class="profile-actions">
                    <button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveBtn">Save Changes</button>
                </div>
            </form>

            <!-- Messages -->
            <div id="successMessage" class="success-message">
                ✓ Profile updated successfully!
            </div>
            <div id="errorMessage" class="error-message">
                ✗ Failed to update profile. Please try again.
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // Load profile data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadProfile();
        });

        // Load profile from localStorage
        function loadProfile() {
            const savedProfile = localStorage.getItem('userProfile');
            if (savedProfile) {
                const profile = JSON.parse(savedProfile);
                document.getElementById('name').value = profile.name || '';
                document.getElementById('email').value = profile.email || '';
                document.getElementById('phoneNumber').value = profile.phoneNumber || '';
                
                if (profile.imageUrl) {
                    const img = document.getElementById('profileImage');
                    const placeholder = document.getElementById('profilePlaceholder');
                    img.src = profile.imageUrl;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                } else if (profile.name) {
                    document.getElementById('profilePlaceholder').textContent = profile.name.charAt(0).toUpperCase();
                }
            }
        }

        // Preview selected image
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('profileImage');
                    const placeholder = document.getElementById('profilePlaceholder');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        // Handle form submission
        function handleSubmit(event) {
            event.preventDefault();
            
            const loadingOverlay = document.getElementById('loadingOverlay');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const saveBtn = document.getElementById('saveBtn');
            
            // Show loading
            loadingOverlay.classList.add('active');
            saveBtn.disabled = true;
            
            // Hide previous messages
            successMessage.classList.remove('active');
            errorMessage.classList.remove('active');
            
            // Simulate API call
            setTimeout(() => {
                try {
                    // Get form data
                    const profile = {
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        phoneNumber: document.getElementById('phoneNumber').value,
                        imageUrl: document.getElementById('profileImage').src
                    };
                    
                    // Save to localStorage
                    localStorage.setItem('userProfile', JSON.stringify(profile));
                    
                    // Hide loading
                    loadingOverlay.classList.remove('active');
                    saveBtn.disabled = false;
                    
                    // Show success message
                    successMessage.classList.add('active');
                    
                    // Hide success message after 3 seconds
                    setTimeout(() => {
                        successMessage.classList.remove('active');
                    }, 3000);
                    
                } catch (error) {
                    // Hide loading
                    loadingOverlay.classList.remove('active');
                    saveBtn.disabled = false;
                    
                    // Show error message
                    errorMessage.classList.add('active');
                    
                    // Hide error message after 3 seconds
                    setTimeout(() => {
                        errorMessage.classList.remove('active');
                    }, 3000);
                }
            }, 1500);
        }

        // Reset form to original values
        function resetForm() {
            loadProfile();
            document.getElementById('successMessage').classList.remove('active');
            document.getElementById('errorMessage').classList.remove('active');
        }

        // Go back to previous page
        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'chat.html'; // fallback
            }
        }

        // Prevent form submission on Enter in input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && e.target.type !== 'submit') {
                    e.preventDefault();
                }
            });
        });
    </script>
        <script src="js/profile.js"></script>

</body>
</html>
